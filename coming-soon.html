<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kymoh — Coming Soon</title>
    <meta name="description"
        content="Kymoh is launching soon. A new era of modern fashion and lifestyle. Stay tuned for something extraordinary.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="coming-soon.css">
</head>

<body>

    <!-- Grain overlay -->
    <div class="grain-overlay" aria-hidden="true"></div>

    <!-- Full-page background image -->
    <div class="bg-image" id="bg-image"></div>
    <div class="bg-overlay"></div>

    <!-- Page content -->
    <div class="page-wrapper">

        <!-- Top bar: brand + social -->
        <header class="top-bar" id="top-bar">
            <div class="brand-logo" id="brand-header">KYMOH</div>
            <div class="social-icons" id="social-links">
                <a href="https://www.facebook.com/share/19fiDDNP83/" target="_blank" rel="noopener noreferrer"
                    class="social-icon" id="facebook-link" aria-label="Follow us on Facebook">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"
                        stroke-linejoin="round">
                        <path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z" />
                    </svg>
                </a>
                <a href="https://www.instagram.com/kymoh.official" target="_blank" rel="noopener noreferrer"
                    class="social-icon" id="instagram-link" aria-label="Follow us on Instagram">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"
                        stroke-linejoin="round">
                        <rect x="2" y="2" width="20" height="20" rx="5" ry="5" />
                        <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z" />
                        <line x1="17.5" y1="6.5" x2="17.51" y2="6.5" />
                    </svg>
                </a>
            </div>
        </header>

        <!-- Center content -->
        <main class="center-content" id="center-content">
            <span class="hero-label" id="hero-label">WE'RE</span>
            <h1 class="hero-heading" id="hero-heading">
                <span class="line line-1">COMING</span>
                <span class="line line-2">SOON</span>
            </h1>
            <p class="hero-description" id="hero-description">
                Something extraordinary is on its way. We're crafting a new
                experience in modern fashion &amp; lifestyle — designed for those
                who dare to stand out.
            </p>
        </main>

        <!-- Bottom bar -->
        <footer class="bottom-bar" id="bottom-bar">
            <span class="footer-text">© 2025 Kymoh. All rights reserved.</span>
        </footer>

    </div>

    <script src="coming-soon.js"></script>
</body>

</html>
